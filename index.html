<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f4">
<meta name="description" content="حلقه‌یار — مسجد امام رضا (ع)، حلقه شهید هادی ذوالفقاری">
<title>حلقه‌یار | حلقه شهید هادی ذوالفقاری</title>
<link rel="stylesheet" href="css/style.css?v=6.13.0-base">
<link rel="stylesheet" href="css/home-app.css?v=1.0.1-clean">
</head>
<body>
<div class="app-container home-app app-shell" data-design-system="110-mobile-app">
  <header class="app-header app-topbar">
    <div class="header-brand">
      <img class="header-brand__mark" src="images/halghe-yar-icon.svg" alt="" width="38" height="38">
      <div><strong>حلقه‌یار</strong><small>مسجد امام رضا (ع)</small></div>
    </div>
    <a class="header-auth" href="login.html" aria-label="ورود یا پروفایل">
      <span class="header-auth__avatar" data-ui-icon="user-round" aria-hidden="true"></span>
    </a>
  </header>

  <main class="app-home-screen">
    <section class="app-greeting" aria-labelledby="homeTitle">
      <h1 id="homeTitle">حلقه شهید هادی ذوالفقاری</h1>
    </section>

    <section class="app-events-section" aria-labelledby="eventsTitle">
      <div class="app-section-heading">
        <div><h2 id="eventsTitle">رویدادها</h2><span>برنامه‌های پیش‌رو</span></div>
        <a href="activities.html" class="section-link">همه <span aria-hidden="true">←</span></a>
      </div>
      <div class="event-carousel app-event-carousel" id="homeEvents">
        <div class="event-loading" role="status"><span></span><p>در حال بارگذاری…</p></div>
      </div>
    </section>


    <section class="app-quick-section" aria-labelledby="quickTitle">
      <div class="app-section-heading"><div><h2 id="quickTitle">دسترسی‌ها</h2></div></div>
      <div class="app-quick-grid">
        <a href="ring-registration.html" class="app-quick-card">
          <span class="app-quick-icon" data-ui-icon="users-round" aria-hidden="true"></span><strong>عضویت در حلقه</strong>
        </a>
        <a href="register.html" class="app-quick-card">
          <span class="app-quick-icon" data-ui-icon="ticket-check" aria-hidden="true"></span><strong>ثبت‌نام اردو</strong>
        </a>
      </div>
    </section>

    <section class="app-wisdom-card app-wisdom-primary" id="homeWisdom" aria-label="حکمت روز">
      <div class="home-wisdom__ornament">حکمت روز</div>
      <div class="home-wisdom__arabic" aria-live="polite">در حال دریافت حکمت…</div>
      <div class="home-wisdom__meaning"></div>
      <div class="home-wisdom__source"></div>
    </section>

    <a class="app-community-card" href="contact.html">
      <span class="community-icon" data-ui-icon="message-square-text" aria-hidden="true"></span>
      <span class="community-copy"><strong>ارتباط با حلقه</strong><small>راه‌های ارتباط و تماس</small></span>
      <span class="community-arrow" aria-hidden="true">←</span>
    </a>
  </main>

  <nav class="bottom-nav" aria-label="ناوبری اصلی"></nav>
</div>


<script src="js/main.js?v=6.17.0-foundation" defer></script>
<script src="js/wisdom.js?v=6.17.0-foundation" defer></script>
</body>
</html>
