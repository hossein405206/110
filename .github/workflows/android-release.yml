name: Android signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "نسخه، مانند 1.0.1"
        required: true
        type: string
      version_code:
        description: "عدد نسخه؛ باید از نسخه قبلی بیشتر باشد"
        required: true
        type: number

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android release signing secrets are not configured."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/halqeh-yar-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/halqeh-yar-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=${ANDROID_VERSION_NAME#v}" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android assembleRelease

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version_name) }}
          name: حلقه‌یار ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version_name) }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
